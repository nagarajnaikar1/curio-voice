name: Build Curio Voice APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log
      - name: Collect output
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ || true
          cp app/build/outputs/apk/release/app-release.apk out/CurioVoice.apk || true
          echo "run ${{ github.run_number }} result: ${{ job.status }}" > out/STATUS.txt
      - name: Publish build to the 'apk' branch
        if: always()
        run: |
          cd out
          git init -q
          git config user.name "curio-build-bot"
          git config user.email "curio-build-bot@users.noreply.github.com"
          git checkout -q -b apk
          git add -A
          git commit -qm "Build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
      - name: Create release (download page)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Curio Voice v1.0.${{ github.run_number }}
          body: "Tap **CurioVoice.apk** below to download, then open it to install."
          files: out/CurioVoice.apk
