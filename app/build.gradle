plugins { id 'com.android.application' }

android {
    namespace 'com.curioplanet.voice'
    compileSdk 34
    defaultConfig {
        applicationId 'com.curioplanet.voice'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        release {
            storeFile file('curio.jks')
            storePassword 'curiovoice'
            keyAlias 'curio'
            keyPassword 'curiovoice'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
